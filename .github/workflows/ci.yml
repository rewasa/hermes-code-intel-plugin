name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node (for real LSP servers)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tree-sitter + ast-grep + LSP test deps
        run: |
          python -m pip install --upgrade pip
          pip install tree-sitter tree-sitter-python tree-sitter-javascript tree-sitter-typescript tree-sitter-rust tree-sitter-go tree-sitter-java ast-grep-py pytest pytest-timeout
          # Real LSP servers so the live diagnostics tests actually run on CI
          # (typescript-language-server + tsserver for TS, pyright for Python).
          npm install -g typescript typescript-language-server@5.1.3 pyright
          npm list -g --depth=0 || true
          npx pyright --version || true
          typescript-language-server --version || true

      - name: Compile check
        run: |
          python -m py_compile code_intel.py lsp_bridge.py __init__.py scripts/health_check.py

      - name: Probe TSLS initialize handshake (diagnose silent no-reply)
        run: |
          node -e '
          const { spawn } = require("child_process");
          const p = spawn("typescript-language-server", ["--stdio"]);
          let got = false;
          p.stdout.on("data", d => { got = true; console.log("TSLS-OUT:", d.toString().slice(0, 200)); });
          p.stderr.on("data", d => console.log("TSLS-ERR:", d.toString().slice(0, 400)));
          p.on("exit", (c, s) => console.log("TSLS-EXIT:", c, s));
          const init = JSON.stringify({jsonrpc:"2.0",id:1,method:"initialize",params:{processId:null,rootUri:"file:///tmp",capabilities:{}}});
          const msg = "Content-Length: " + Buffer.byteLength(init) + "\r\n\r\n" + init;
          p.stdin.write(msg);
          setTimeout(() => { if (!got) { console.log("TSLS: NO RESPONSE in 8s"); process.exit(1);} }, 8000);
          '

      - name: Run tests
        run: |
          python -m pytest -q --timeout=120 --timeout-method=thread --maxfail=6 -p faulthandler --junitxml=pytest-result.xml
      - name: Dump test result summary (always, for debugging hangs)
        if: always()
        run: |
          tail -c 4000 pytest-result.xml || true
          grep -o 'testcase name="[^"]*"' pytest-result.xml | tail -40 || true
